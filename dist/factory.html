<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ফ্যাক্টরি হিসাব</title>
<style>
:root{--bg:#f2f4f6;--sf:#fff;--ink:#17232e;--mut:#667684;--ln:#dde3e8;--ac:#0e6b5c;--acs:#dcefeb;--tu:#d9981a;--rd:#c0392b;--gr:#1f8a4c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Hind Siliguri','Noto Sans Bengali','Segoe UI',sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:linear-gradient(180deg,#0a2d28,#0e4a40);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;box-shadow:2px 0 14px rgba(0,0,0,.14)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}.lg2{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#f0b440,#d9981a);color:#3a2700;display:grid;place-items:center;font-weight:700;font-size:20px}.brand b{display:block;font-size:16px}.brand small{display:block;font-size:11.5px;opacity:.7}.mn{font-size:11px;letter-spacing:.08em;opacity:.55;margin:2px 10px 6px}
nav button{all:unset;display:flex;align-items:center;gap:10px;cursor:pointer;padding:9px 12px;border-radius:8px;color:#e6f4f1;position:relative}nav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}nav button.on{background:#fff;color:#0e6b5c;font-weight:700}nav button.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:#f0b440}nav button.lang{border:1px solid rgba(255,255,255,.4);justify-content:center;font-weight:600;margin-top:6px}nav .sp{flex:1}
main{flex:1;min-width:0;padding:28px 32px 48px;max-width:1180px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:22px}.top h2{margin:0;font-size:26px}.sub{margin:2px 0 0;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:9px;padding:9px 11px;min-width:0}input:focus,select:focus{outline:2px solid var(--ac)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}.k{border:1px solid var(--ln);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;align-items:center;background:var(--sf);box-shadow:0 1px 2px rgba(16,35,46,.05),0 6px 18px rgba(16,35,46,.05)}.k span{color:var(--mut);font-size:13px}.k b{grid-column:1;font-size:26px}.k i.ic{grid-row:1/3;grid-column:2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--acs);color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px;margin-bottom:16px}.card h3{margin:0 0 12px;font-size:15.5px}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.form label{font-size:12px;color:var(--mut)}
.btn{border:0;border-radius:8px;background:var(--ac);color:#fff;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}.btn.g{background:transparent;color:var(--rd);box-shadow:none}.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:11px 10px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{background:var(--bg);color:var(--mut);font-size:12.5px}td.n,th.n{text-align:right}.tag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--acs);color:var(--ac);font-size:12px}.dn{color:var(--rd);font-weight:700}.up{color:var(--gr);font-weight:700}.em{padding:18px;text-align:center;color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:14px;height:170px}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.bars{height:130px;width:100%;display:flex;gap:4px;align-items:flex-end;justify-content:center}.bars i{width:38%;max-width:30px;border-radius:5px 5px 0 0;background:var(--ac)}.bars i.c{background:var(--tu)}.col small{color:var(--mut);margin-top:6px}.lg{display:flex;gap:16px;color:var(--mut)}.lg b{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--ac);margin-right:5px}.lg b.c{background:var(--tu)}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bar{height:8px;background:var(--acs);border-radius:5px;margin:3px 0 10px}.bar i{display:block;height:100%;background:var(--ac);border-radius:5px}
#rcm{position:fixed;inset:0;z-index:50;background:rgba(10,20,25,.62);overflow:auto;padding:20px}.rcw{max-width:560px;margin:auto}.paper{background:#fff;color:#111;padding:28px}.paper h1{text-align:center;margin:0}.paper h3{text-align:center;border-block:2px solid #111;padding:6px}.tt{width:60%;margin-left:auto}.tt div{display:flex;justify-content:space-between;padding:4px;border-bottom:1px dotted #aaa}.sg{display:flex;justify-content:space-between;margin-top:48px}.sg span{border-top:1px solid #111;padding-top:4px}
@media(max-width:820px){body{flex-direction:column}nav{width:100%;height:auto;position:sticky;top:0;z-index:5;flex-direction:row;overflow-x:auto;padding:8px}.brand,.mn,nav .sp{display:none}nav button{white-space:nowrap;padding:8px 11px}main{padding:16px 14px 32px}.row{grid-template-columns:1fr}}
</style>
</head>
<body><nav id="nav"></nav><main id="m"></main>
<script>
var K='factory_hisab_v1',V='dash',M='',S=[];var CAT=['বিস্কুট','কেক','চানাচুর','অন্যান্য'];var T={sale:{n:'বিক্রয়',c:CAT,pay:1,party:'ক্রেতা / দোকান',qty:1},purchase:{n:'কাঁচামাল ক্রয়',c:['ময়দা','চিনি','তেল','ডিম','বাদাম/ডাল','প্যাকেজিং','অন্যান্য'],pay:1,party:'সরবরাহকারী',qty:1},production:{n:'উৎপাদন',c:CAT,qty:1,noamt:1},expense:{n:'অন্যান্য খরচ',c:['বেতন','বিদ্যুৎ','গ্যাস','ভাড়া','পরিবহন','মেরামত','অন্যান্য']}};var NAV=[['dash','ড্যাশবোর্ড'],['sale','বিক্রয়'],['purchase','কাঁচামাল ক্রয়'],['production','উৎপাদন'],['expense','খরচ'],['stock','স্টক'],['due','বাকি / পাওনা'],['report','রিপোর্ট']];
function today(){return new Date().toISOString().slice(0,10)}function ld(){try{var r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}}function sv(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function tk(n){return '৳'+Math.round(n).toLocaleString('en-IN')}function nm(n){return Math.round(n).toLocaleString('en-IN')}
function ft(){return S.filter(function(e){return !M||e.d.slice(0,7)==M})}function sum(L,t,f){return L.filter(function(e){return e.t==t}).reduce(function(s,e){return s+(f?f(e):e.a)},0)}
var IC={dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',sale:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',purchase:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/>',production:'<path d="M3 21V10l6 4v-4l6 4V6h3v15z"/>',expense:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',stock:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',due:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',report:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'};function svg(k){return '<svg viewBox="0 0 24 24">'+IC[k]+'</svg>'}
function nav(){var n=document.getElementById('nav');n.innerHTML='<div class="brand"><div class="lg2">ফ</div><div><b>ফ্যাক্টরি হিসাব</b><small>বিস্কুট · কেক · চানাচুর</small></div></div><div class="mn">মেনু</div>'+NAV.map(function(x){return '<button class="'+(V==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+svg(x[0])+x[1]+'</button>'}).join('')+'<span class="sp"></span><button onclick="reset()">ডেমো ডাটা মুছুন</button><button class="lang" onclick="setL()" id="langBtn">English</button>'}function go(v){V=v;R()}function mon(v){M=v;R()}function hd(t){var d=new Date().toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return '<div class="top"><div><h2>'+t+'</h2><p class="sub">'+d+'</p></div><div><input type="month" value="'+M+'" onchange="mon(this.value)"><button class="btn" onclick="mon(\'\')">সব সময়</button></div></div>'}
function kp(c,l,v,k){return '<div class="k '+c+'"><span>'+l+'</span><b>'+v+'</b><i class="ic">'+svg(k||'dash')+'</i></div>'}
function dash(){var L=ft(),sl=sum(L,'sale'),pu=sum(L,'purchase'),ex=sum(L,'expense'),pr=sl-pu-ex,rc=sum(L,'sale',function(e){return e.a-e.pd}),pb=sum(L,'purchase',function(e){return e.a-e.pd});var h=hd('ড্যাশবোর্ড')+'<div class="kpis">'+kp('','মোট বিক্রয়',tk(sl),'sale')+kp('tu','কাঁচামাল ক্রয়',tk(pu),'purchase')+kp('tu','অন্যান্য খরচ',tk(ex),'expense')+kp(pr>=0?'gr':'rd',pr>=0?'নীট লাভ':'নীট লোকসান',tk(Math.abs(pr),'report')||tk(Math.abs(pr)),'report')+kp('gr','বাকি পাওনা',tk(rc),'due')+kp('rd','বাকি দেনা',tk(pb),'due')+'</div>';return h}
function R(){nav();var h=V=='dash'?dash():T[V]?list(V):V=='stock'?stock():V=='due'?due():report();document.getElementById('m').innerHTML=h;window.scrollTo(0,0)}
function list(t){var c=T[t],L=ft().filter(function(e){return e.t==t}).sort(function(a,b){return a.d<b.d?1:-1}),h=hd(c.n);h+='<div class="card"><h3>নতুন এন্ট্রি</h3><div class="form"><div><label>তারিখ</label><input id="f_d" type="date" value="'+today()+'"></div><div><label>খাত / ধরন</label><select id="f_c">'+c.c.map(function(x){return '<option>'+x+'</option>'}).join('')+'</select></div><div><label>বিবরণ / পণ্যের নাম</label><input id="f_i"></div>'+(c.party?'<div><label>'+c.party+'</label><input id="f_p"></div>':'')+(c.qty?'<div><label>পরিমাণ</label><input id="f_q" type="number"></div>':'')+(c.noamt?'':'<div><label>মোট টাকা</label><input id="f_a" type="number"></div>')+(c.pay?'<div><label>নগদ পরিশোধ</label><input id="f_pd" type="number"></div>':'')+'<button class="btn" onclick="add(\''+t+'\')">সংরক্ষণ করুন</button></div></div>';h+='<div class="card"><div class="tw">'+(L.length?'<table><tr><th>তারিখ</th><th>খাত</th><th>বিবরণ</th><th>পক্ষ</th><th class="n">পরিমাণ</th><th class="n">টাকা</th><th class="n">বাকি</th><th></th></tr>'+L.map(function(e){return '<tr><td>'+e.d+'</td><td><span class="tag">'+esc(e.c)+'</span></td><td>'+esc(e.i)+'</td><td>'+esc(e.p)+'</td><td class="n">'+(e.q?nm(e.q):'—')+'</td><td class="n">'+tk(e.a)+'</td><td class="n">'+tk(e.a-e.pd)+'</td><td><button class="btn g" onclick="rc('+e.id+')">রসিদ</button> <button class="btn g" onclick="del('+e.id+')">মুছুন</button></td></tr>'}).join('')+'</table>':'<div class="em">এই সময়ে কোনো এন্ট্রি নেই।</div>')+'</div></div>';return h}
function g(i){var e=document.getElementById(i);return e?e.value:''}function add(t){var c=T[t],a=+(g('f_a')||0),i=g('f_i').trim();if(!i){document.getElementById('f_i').focus();return}S.push({id:Date.now(),t:t,d:g('f_d')||today(),c:g('f_c'),i:i,p:g('f_p').trim(),q:+(g('f_q')||0),a:a,pd:c.pay?(g('f_pd')===''?a:+g('f_pd')):a});sv();R()}function del(id){if(confirm('এই এন্ট্রি মুছে ফেলবেন?')){S=S.filter(function(e){return e.id!=id});sv();R()}}
function stock(){var m={};S.forEach(function(e){if(e.t!='production'&&e.t!='sale')return;var k=e.i.trim().toLowerCase();m[k]=m[k]||{i:e.i,c:e.c,p:0,s:0};if(e.t=='production')m[k].p+=e.q;else m[k].s+=e.q});var k=Object.keys(m);return hd('পণ্যের স্টক')+'<div class="card"><div class="tw">'+(k.length?'<table><tr><th>পণ্য</th><th>ধরন</th><th class="n">উৎপাদন</th><th class="n">বিক্রয়</th><th class="n">স্টক</th></tr>'+k.map(function(x){var r=m[x],s=r.p-r.s;return '<tr><td>'+esc(r.i)+'</td><td>'+esc(r.c)+'</td><td class="n">'+nm(r.p)+'</td><td class="n">'+nm(r.s)+'</td><td class="n '+(s<50?'dn':'up')+'">'+nm(s)+'</td></tr>'}).join('')+'</table>':'<div class="em">উৎপাদন ও বিক্রয় এন্ট্রি দিলে স্টক এখানে দেখা যাবে।</div>')+'</div></div>'}
function due(){var r={},p={};S.forEach(function(e){var d=e.a-e.pd;if(d<=0)return;if(e.t=='sale')r[e.p||'অজানা']=(r[e.p||'অজানা']||0)+d;if(e.t=='purchase')p[e.p||'অজানা']=(p[e.p||'অজানা']||0)+d});function tb(o,cl){var k=Object.keys(o);return k.length?'<table><tr><th>পার্টি</th><th class="n">টাকা</th></tr>'+k.map(function(x){return '<tr><td>'+esc(x)+'</td><td class="n '+cl+'">'+tk(o[x])+'</td></tr>'}).join('')+'</table>':'<div class="em">কোনো বাকি নেই</div>'}return hd('বাকি / পাওনা')+'<div class="row"><div class="card"><h3>আমরা পাব</h3>'+tb(r,'up')+'</div><div class="card"><h3>আমরা দেব</h3>'+tb(p,'dn')+'</div></div>'}
function report(){var ms={};S.forEach(function(e){var m=e.d.slice(0,7);ms[m]=ms[m]||[];ms[m].push(e)});var k=Object.keys(ms).sort().reverse();return hd('মাসিক রিপোর্ট')+'<div class="card"><table><tr><th>মাস</th><th>বিক্রয়</th><th>কাঁচামাল</th><th>খরচ</th><th>লাভ / লোকসান</th></tr>'+k.map(function(m){var l=ms[m],sl=sum(l,'sale'),pu=sum(l,'purchase'),ex=sum(l,'expense'),pr=sl-pu-ex;return '<tr><td>'+m+'</td><td>'+tk(sl)+'</td><td>'+tk(pu)+'</td><td>'+tk(ex)+'</td><td class="'+(pr>=0?'up':'dn')+'">'+tk(pr)+'</td></tr>'}).join('')+'</table></div>'}
var L='bn';function setL(){L=L=='bn'?'en':'bn';document.documentElement.lang=L=='en'?'en':'bn';R()}S=ld()||[];R();
</script>
</body>
</html>
