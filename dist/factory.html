<style>

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Hind Siliguri','Noto Sans Bengali','Segoe UI',sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:var(--ac);color:#fff;padding:20px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:4px}

nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:#e6f4f1;font-weight:500}
nav button:hover{background:rgba(255,255,255,.12)}nav button.on{background:#fff;color:#0e6b5c;font-weight:700}
nav button:focus-visible,.btn:focus-visible{outline:2px solid var(--tu);outline-offset:2px}
nav .sp{flex:1}
main{flex:1;min-width:0;padding:24px 28px 40px;max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h2{margin:0;font-size:24px}
input,select{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
.top input{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;border-left:5px solid var(--ac)}
.k span{color:var(--mut);font-size:13px}.k b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.k.tu{border-left-color:var(--tu)}.k.rd{border-left-color:var(--rd)}.k.gr{border-left-color:var(--gr)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;align-items:end}
.form label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.btn{cursor:pointer;border:0;background:var(--ac);color:#fff;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600}
.btn.g{background:transparent;color:var(--rd);padding:2px 8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln);white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--mut);font-weight:500;font-size:13px;background:var(--bg)}
td.n,th.n{text-align:right}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--acs);color:var(--ac);font-size:12px;font-weight:600}
.dn{color:var(--rd);font-weight:600}.up{color:var(--gr);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:14px;height:170px;padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.bars{display:flex;gap:4px;align-items:flex-end;height:130px;width:100%;justify-content:center}
.bars i{width:34%;max-width:26px;border-radius:5px 5px 0 0;background:var(--ac);min-height:2px}
.bars i.c{background:var(--tu)}
.col small{color:var(--mut);margin-top:6px}
.lg{display:flex;gap:16px;font-size:13px;color:var(--mut);margin-bottom:4px}
.lg b{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--ac);margin-right:5px}.lg b.c{background:var(--tu)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bar{height:8px;border-radius:5px;background:var(--acs);margin:3px 0 10px}.bar i{display:block;height:100%;background:var(--ac);border-radius:5px}
.em{color:var(--mut);padding:18px 0;text-align:center}
@media(max-width:820px){body{flex-direction:column}
nav{width:100%;height:auto;position:sticky;top:0;z-index:5;flex-direction:row;overflow-x:auto;padding:8px;gap:2px;align-items:center}

main{padding:16px 14px 32px}.row{grid-template-columns:1fr}}

nav button.rs{font-size:13px;opacity:.65}
main{max-width:1180px;margin:0 auto;padding:28px 32px 48px}
.top{margin-bottom:22px;align-items:flex-end}
h2{font-size:26px;font-weight:700;letter-spacing:-.01em}.sub{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.top .btn{padding:8px 14px;font-size:13px}
.k{border-left:1px solid var(--ln);border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;align-items:center;box-shadow:0 1px 2px rgba(16,35,46,.05),0 6px 18px rgba(16,35,46,.05)}
.k b{font-size:26px;font-weight:700}
.k i.ic{grid-row:1/3;grid-column:2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--acs);color:var(--ac)}
.k.tu i.ic{background:rgba(217,152,26,.17);color:var(--tu)}.k.rd i.ic{background:rgba(192,57,43,.14);color:var(--rd)}.k.gr i.ic{background:rgba(31,138,76,.14);color:var(--gr)}
.k i.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(16,35,46,.05),0 6px 18px rgba(16,35,46,.04)}
.card h3{font-size:15.5px;font-weight:600}
input,select{border-radius:9px;padding:9px 11px}
.btn{box-shadow:0 1px 2px rgba(0,0,0,.18);transition:filter .15s}.btn:hover{filter:brightness(1.12)}.btn.g{box-shadow:none}
th{font-size:12.5px;font-weight:600;letter-spacing:.02em}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
td{padding:11px 10px}tr:hover td{background:color-mix(in srgb,var(--acs) 45%,transparent)}
.bars i{width:38%;max-width:30px}
@media(max-width:820px){.brand,.mn,nav button.rs{display:none}nav button.on::before{display:none}main{padding:16px 14px 32px}}
#rcm{position:fixed;inset:0;z-index:50;background:rgba(10,20,25,.62);overflow:auto;padding:20px 12px}
.rcw{max-width:560px;margin:0 auto}
.rcb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.rcb input{flex:1 1 180px}
.paper{background:#fff;color:#111;padding:28px 30px;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:14px}
.paper h1{margin:0;text-align:center;font-size:22px}.paper .ad{text-align:center;margin:2px 0 12px;color:#555;font-size:13px}
.paper h3{text-align:center;margin:0 0 12px;padding:6px 0;border-top:2px solid #111;border-bottom:2px solid #111;font-size:15px}
.paper .mt{display:flex;justify-content:space-between;margin-bottom:8px;color:#333}
.paper table{min-width:0;width:100%}.paper th{background:#eee;color:#111}.paper td,.paper th{border-bottom:1px solid #ccc}
.tt{margin:14px 0 0 auto;width:60%}.tt div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted #aaa}
.sg{display:flex;justify-content:space-between;margin-top:48px}.sg span{border-top:1px solid #111;padding-top:4px;font-size:12.5px}
@media print{nav,.top .btn,.top input,.btn.g,.noprint,.form{display:none!important}body{display:block;background:#fff}main{padding:0;max-width:none}.card{box-shadow:none;border:0;padding:0}body.rcp main,body.rcp nav{display:none!important}body.rcp #rcm{position:static;background:none;padding:0}.paper{box-shadow:none;padding:0}}
nav button.lang{border:1px solid rgba(255,255,255,.4);justify-content:center;font-weight:600;margin-top:6px}
</style></head><body>

<script>
var K='factory_hisab_v1',V='dash',M='',S=[];
var CAT=['বিস্কুট','কেক','চানাচুর','অন্যান্য'];
var T={sale:{n:'বিক্রয়',c:CAT,pay:1,party:'ক্রেতা / দোকান',qty:1},
purchase:{n:'কাঁচামাল ক্রয়',c:['ময়দা','চিনি','তেল','ডিম','বাদাম/ডাল','প্যাকেজিং','অন্যান্য'],pay:1,party:'সরবরাহকারী',qty:1},
production:{n:'উৎপাদন',c:CAT,qty:1,noamt:1},
expense:{n:'অন্যান্য খরচ',c:['বেতন','বিদ্যুৎ','গ্যাস','ভাড়া','পরিবহন','মেরামত','অন্যান্য']}};
var NAV=[['dash','ড্যাশবোর্ড'],['sale','বিক্রয়'],['purchase','কাঁচামাল ক্রয়'],['production','উৎপাদন'],['expense','খরচ'],['stock','স্টক'],['due','বাকি / পাওনা'],['report','রিপোর্ট']];
function today(){return new Date().toISOString().slice(0,10)}
function ld(){try{var r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return null}
function sv(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function seed(){var d=new Date(),o=[],id=1;function dt(b){var x=new Date(d.getFullYear(),d.getMonth()-b,10);return x.toISOString().slice(0,10)}
for(var b=0;b<4;b++){var f=1+b*.12;
o.push({id:id++,t:'sale',d:dt(b),c:'বিস্কুট',i:'গ্লুকোজ বিস্কুট',p:'রহমান স্টোর',q:Math.round(400*f),a:Math.round(48000*f),pd:Math.round(40000*f)});
o.push({id:id++,t:'sale',d:dt(b),c:'কেক',i:'স্লাইস কেক',p:'আলম এন্টারপ্রাইজ',q:Math.round(250*f),a:Math.round(30000*f),pd:Math.round(30000*f)});
o.push({id:id++,t:'sale',d:dt(b),c:'চানাচুর',i:'ঝাল চানাচুর',p:'রহমান স্টোর',q:Math.round(300*f),a:Math.round(21000*f),pd:Math.round(15000*f)});
o.push({id:id++,t:'purchase',d:dt(b),c:'ময়দা',i:'ময়দা (বস্তা)',p:'করিম ট্রেডার্স',q:60,a:Math.round(52000*f),pd:Math.round(45000*f)});
o.push({id:id++,t:'purchase',d:dt(b),c:'তেল',i:'সয়াবিন তেল',p:'করিম ট্রেডার্স',q:40,a:Math.round(18000*f),pd:Math.round(18000*f)});
o.push({id:id++,t:'expense',d:dt(b),c:'বেতন',i:'শ্রমিক বেতন',p:'',q:0,a:25000,pd:25000});
o.push({id:id++,t:'expense',d:dt(b),c:'বিদ্যুৎ',i:'বিদ্যুৎ বিল',p:'',q:0,a:6500,pd:6500});
o.push({id:id++,t:'production',d:dt(b),c:'বিস্কুট',i:'গ্লুকোজ বিস্কুট',p:'',q:Math.round(500*f),a:0,pd:0});
o.push({id:id++,t:'production',d:dt(b),c:'কেক',i:'স্লাইস কেক',p:'',q:Math.round(300*f),a:0,pd:0});
o.push({id:id++,t:'production',d:dt(b),c:'চানাচুর',i:'ঝাল চানাচুর',p:'',q:Math.round(340*f),a:0,pd:0});}
return o}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tk(n){return '৳'+Math.round(n).toLocaleString('en-IN')}
function nm(n){return Math.round(n).toLocaleString('en-IN')}
function ft(){return S.filter(function(e){return !M||e.d.slice(0,7)===M})}
function sum(L,t,f){return L.filter(function(e){return e.t===t}).reduce(function(s,e){return s+(f?f(e):e.a)},0)}
function nav(){document.getElementById('nav').innerHTML='<h1>ফ্যাক্টরি হিসাব</h1><small>বিস্কুট · কেক · চানাচুর</small>'+NAV.map(function(x){return '<button class="'+(V===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'<span class="sp"></span><button onclick="reset()">ডেমো ডাটা মুছুন</button>'}
function go(v){V=v;R()}
function mon(v){M=v;R()}
function hd(t){return '<div class="top"><h2>'+t+'</h2><div><input type="month" value="'+M+'" onchange="mon(this.value)" aria-label="মাস বাছাই"> <button class="btn" style="background:var(--mut)" onclick="mon(\'\')">সব সময়</button></div></div>'}
function R(){nav();var h=V==='dash'?dash():T[V]?list(V):V==='stock'?stock():V==='due'?due():report();document.getElementById('m').innerHTML=h;window.scrollTo(0,0)}
function kp(c,l,v){return '<div class="k '+c+'"><span>'+l+'</span><b>'+v+'</b></div>'}
function dash(){var L=ft(),sl=sum(L,'sale'),pu=sum(L,'purchase'),ex=sum(L,'expense'),pr=sl-pu-ex;
var rc=sum(L,'sale',function(e){return e.a-e.pd}),pb=sum(L,'purchase',function(e){return e.a-e.pd});
var h=hd('ড্যাশবোর্ড')+'<div class="kpis">'+kp('','মোট বিক্রয়',tk(sl))+kp('tu','কাঁচামাল ক্রয়',tk(pu))+kp('tu','অন্যান্য খরচ',tk(ex))+kp(pr>=0?'gr':'rd',pr>=0?'নীট লাভ':'নীট লোকসান',tk(Math.abs(pr)))+kp('gr','বাকি পাওনা',tk(rc))+kp('rd','বাকি দেনা',tk(pb))+'</div>';
var now=new Date(),ms=[];for(var i=5;i>=0;i--){var x=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push(x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2))}
var vals=ms.map(function(m){var l=S.filter(function(e){return e.d.slice(0,7)===m});return[sum(l,'sale'),sum(l,'purchase')+sum(l,'expense')]}),mx=Math.max(1,Math.max.apply(null,vals.map(function(v){return Math.max(v[0],v[1])})));
h+='<div class="card"><h3>গত ৬ মাস</h3><div class="lg"><span><b></b>বিক্রয়</span><span><b class="c"></b>মোট খরচ</span></div><div class="chart">'+ms.map(function(m,i){return '<div class="col"><div class="bars"><i style="height:'+vals[i][0]/mx*100+'%" title="'+tk(vals[i][0])+'"></i><i class="c" style="height:'+vals[i][1]/mx*100+'%" title="'+tk(vals[i][1])+'"></i></div><small>'+m.slice(5)+'/'+m.slice(2,4)+'</small></div>'}).join('')+'</div></div>';
h+='<div class="row"><div class="card"><h3>পণ্য অনুযায়ী বিক্রয়</h3>'+share(L,'sale',CAT)+'</div><div class="card"><h3>খরচের খাত</h3>'+share(L.filter(function(e){return e.t==='expense'||e.t==='purchase'}),null,null)+'</div></div>';
return h}
function share(L,t,cats){var m={},tot=0;L.filter(function(e){return !t||e.t===t}).forEach(function(e){m[e.c]=(m[e.c]||0)+e.a;tot+=e.a});var k=Object.keys(m).sort(function(a,b){return m[b]-m[a]});
if(!k.length)return '<div class="em">এখনো কোনো এন্ট্রি নেই</div>';return k.map(function(c){return '<div style="display:flex;justify-content:space-between"><span>'+esc(c)+'</span><b>'+tk(m[c])+'</b></div><div class="bar"><i style="width:'+m[c]/tot*100+'%"></i></div>'}).join('')}
function list(t){var c=T[t],L=ft().filter(function(e){return e.t===t}).sort(function(a,b){return a.d<b.d?1:-1}),h=hd(c.n);
